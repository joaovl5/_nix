[project]
  name = "lav-shell"
  version = "0.1.0"
  description = "Local data providers for the Eww-based lav shell"
  authors = [
    { name = "Joao Pedro", email = "vieiraleao2005@gmail.com" },
  ]
  requires-python = ">=3.14"
  dependencies = [
    "attrs>=26.1.0",
    "icalendar>=7.2.2",
    "pydantic>=2.13.4",
    "recurring-ical-events>=3.8.2",
    "requests>=2.34.2",
  ]

  [project.scripts]
    calendar-state = "lav_shell.calendar:main"

[build-system]
  requires      = ["uv_build>=0.11.25,<0.12.0"]
  build-backend = "uv_build"
